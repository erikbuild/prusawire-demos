#####################################################################
# Prusawire booth demo loop  (optional)
#
# Install: copy this file next to printer.cfg and add
#     [include prusawire_demo.cfg]
# then restart Klipper.
#
# Use (Mainsail console or a macro button):
#     DEMO_LOOP                      ; loops prusawire_00_showreel_loop.gcode
#     DEMO_LOOP PAUSE=30             ; 30 s rest between passes (default 10)
#     DEMO_LOOP FILE=my_file.gcode   ; any file ending in _DEMO_FILE_DONE
#     DEMO_STOP                      ; stop looping; current pass finishes
#     DEMO_STOP NOW=1                ; stop looping and cancel right away
#
# How it works: the loop file ends with _DEMO_FILE_DONE, which arms a
# delayed_gcode timer. When it fires and the printer is idle, it starts
# the file again with SDCARD_PRINT_FILE. Nothing heats, nothing extrudes.
#####################################################################

[gcode_macro DEMO_LOOP]
description: Run a demo file on repeat until DEMO_STOP
variable_active: False
variable_file: "prusawire_00_showreel_loop.gcode"
variable_pause: 10
gcode:
    {% set f = params.FILE|default("prusawire_00_showreel_loop.gcode") %}
    {% set p = params.PAUSE|default(10)|int %}
    SET_GCODE_VARIABLE MACRO=DEMO_LOOP VARIABLE=file VALUE='"{f}"'
    SET_GCODE_VARIABLE MACRO=DEMO_LOOP VARIABLE=pause VALUE={p}
    SET_GCODE_VARIABLE MACRO=DEMO_LOOP VARIABLE=active VALUE=True
    RESPOND MSG="Demo loop ON: {f}, {p}s between passes. DEMO_STOP to end."
    SDCARD_PRINT_FILE FILENAME="{f}"

[gcode_macro _DEMO_FILE_DONE]
description: Called at the end of a loop demo file
gcode:
    {% set d = printer["gcode_macro DEMO_LOOP"] %}
    {% if d.active %}
        RESPOND MSG="Demo pass done - next in {d.pause}s"
        UPDATE_DELAYED_GCODE ID=_demo_relaunch DURATION={d.pause}
    {% endif %}

[delayed_gcode _demo_relaunch]
gcode:
    {% set d = printer["gcode_macro DEMO_LOOP"] %}
    {% if d.active %}
        {% if printer.print_stats.state in ["printing", "paused"] %}
            UPDATE_DELAYED_GCODE ID=_demo_relaunch DURATION=5
        {% else %}
            SDCARD_PRINT_FILE FILENAME="{d.file}"
        {% endif %}
    {% endif %}

[gcode_macro DEMO_STOP]
description: Stop the demo loop (NOW=1 also cancels the current pass)
gcode:
    SET_GCODE_VARIABLE MACRO=DEMO_LOOP VARIABLE=active VALUE=False
    UPDATE_DELAYED_GCODE ID=_demo_relaunch DURATION=0
    {% if params.NOW|default(0)|int == 1 and printer.print_stats.state in ["printing", "paused"] %}
        RESPOND MSG="Demo loop OFF - cancelling current pass"
        CANCEL_PRINT
    {% else %}
        RESPOND MSG="Demo loop OFF - current pass will finish"
    {% endif %}
